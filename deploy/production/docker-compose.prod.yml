name: penpot-prod

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "20m"
    max-file: "5"

x-flags: &penpot-flags
  PENPOT_FLAGS: "${PENPOT_FLAGS:-enable-smtp enable-backend-worker enable-redis-cache enable-mcp}"

x-uri: &penpot-public-uri
  PENPOT_PUBLIC_URI: ${PENPOT_PUBLIC_URI:-https://localhost}

x-body-size: &penpot-http-body-size
  PENPOT_HTTP_SERVER_MAX_BODY_SIZE: 367001600
  PENPOT_HTTP_SERVER_MAX_MULTIPART_BODY_SIZE: 367001600

x-secret-key: &penpot-secret-key
  PENPOT_SECRET_KEY: "${PENPOT_SECRET_KEY:?PENPOT_SECRET_KEY must be set in .env}"

x-database: &penpot-database
  PENPOT_DATABASE_URI: postgresql://penpot-postgres/penpot
  PENPOT_DATABASE_USERNAME: ${POSTGRES_USER:-penpot}
  PENPOT_DATABASE_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}"

networks:
  penpot:
    driver: bridge

volumes:
  penpot_postgres_v15:
  penpot_assets:
  penpot_caddy_data:
  penpot_caddy_config:

services:
  caddy:
    image: caddy:2.8-alpine
    restart: always
    logging: *default-logging
    ports:
      - "${PENPOT_HTTP_BIND:-127.0.0.1}:80:80"
      - "${PENPOT_HTTPS_BIND:-127.0.0.1}:443:443"
    environment:
      PENPOT_DOMAIN: ${PENPOT_DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - penpot_caddy_data:/data
      - penpot_caddy_config:/config
    depends_on:
      penpot-frontend:
        condition: service_healthy
    networks:
      - penpot

  penpot-frontend:
    image: "penpotapp/frontend:${PENPOT_VERSION:-2.19}"
    restart: always
    logging: *default-logging
    # Strict loopback binding for local debug access if needed
    ports:
      - "127.0.0.1:${PENPOT_LOCAL_PORT:-9001}:8080"
    volumes:
      - penpot_assets:/opt/data/assets
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /readyz HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && IFS= read -r status <&3 && [[ \"$$status\" == *' 200 '* ]]"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      penpot-backend:
        condition: service_healthy
      penpot-admin-console:
        condition: service_started
      penpot-mcp:
        condition: service_started
      penpot-exporter:
        condition: service_healthy
    networks:
      - penpot
    environment:
      << : [*penpot-flags, *penpot-http-body-size, *penpot-public-uri]
      PENPOT_ADMIN_CONSOLE_URI: http://penpot-admin-console:3000

  penpot-backend:
    image: "penpotapp/backend:${PENPOT_VERSION:-2.19}"
    restart: always
    logging: *default-logging
    volumes:
      - penpot_assets:/opt/data/assets
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:6060/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      penpot-postgres:
        condition: service_healthy
      penpot-valkey:
        condition: service_healthy
    networks:
      - penpot
    environment:
      << : [*penpot-flags, *penpot-public-uri, *penpot-http-body-size, *penpot-secret-key, *penpot-database]
      PENPOT_ADMIN_CONSOLE_URI: http://penpot-admin-console:3000
      PENPOT_REDIS_URI: redis://penpot-valkey/0
      PENPOT_OBJECTS_STORAGE_BACKEND: ${PENPOT_OBJECTS_STORAGE_BACKEND:-fs}
      PENPOT_OBJECTS_STORAGE_FS_DIRECTORY: /opt/data/assets
      # Optional S3 Storage
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      PENPOT_OBJECTS_STORAGE_S3_ENDPOINT: ${PENPOT_OBJECTS_STORAGE_S3_ENDPOINT:-}
      PENPOT_OBJECTS_STORAGE_S3_BUCKET: ${PENPOT_OBJECTS_STORAGE_S3_BUCKET:-}
      PENPOT_OBJECTS_STORAGE_S3_REGION: ${PENPOT_OBJECTS_STORAGE_S3_REGION:-}
      # Telemetry
      PENPOT_TELEMETRY_ENABLED: ${PENPOT_TELEMETRY_ENABLED:-false}
      # SMTP Configuration
      PENPOT_SMTP_DEFAULT_FROM: ${PENPOT_SMTP_DEFAULT_FROM:-no-reply@example.com}
      PENPOT_SMTP_DEFAULT_REPLY_TO: ${PENPOT_SMTP_DEFAULT_REPLY_TO:-no-reply@example.com}
      PENPOT_SMTP_HOST: "${PENPOT_SMTP_HOST:-}"
      PENPOT_SMTP_PORT: ${PENPOT_SMTP_PORT:-587}
      PENPOT_SMTP_USERNAME: ${PENPOT_SMTP_USERNAME:-}
      PENPOT_SMTP_PASSWORD: ${PENPOT_SMTP_PASSWORD:-}
      PENPOT_SMTP_TLS: ${PENPOT_SMTP_TLS:-true}
      PENPOT_SMTP_SSL: ${PENPOT_SMTP_SSL:-false}

  penpot-admin-console:
    image: "penpotapp/admin-console:${PENPOT_VERSION:-2.19}"
    restart: always
    logging: *default-logging
    depends_on:
      penpot-postgres:
        condition: service_healthy
    networks:
      - penpot
    environment:
      << : [*penpot-public-uri, *penpot-secret-key, *penpot-database]
      PENPOT_INTERNAL_URI: http://penpot-frontend:8080

  penpot-mcp:
    image: "penpotapp/mcp:${PENPOT_VERSION:-2.19}"
    restart: always
    logging: *default-logging
    networks:
      - penpot

  penpot-exporter:
    image: "penpotapp/exporter:${PENPOT_VERSION:-2.19}"
    restart: always
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:6061/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      penpot-valkey:
        condition: service_healthy
    networks:
      - penpot
    environment:
      << : [*penpot-flags, *penpot-secret-key, *penpot-public-uri]
      PENPOT_INTERNAL_URI: http://penpot-frontend:8080
      PENPOT_REDIS_URI: redis://penpot-valkey/0

  penpot-postgres:
    image: "postgres:15-alpine"
    restart: always
    stop_signal: SIGINT
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"${POSTGRES_USER:-penpot}\" -d penpot"]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 5s
    volumes:
      - penpot_postgres_v15:/var/lib/postgresql/data
    networks:
      - penpot
    environment:
      POSTGRES_INITDB_ARGS: --data-checksums
      POSTGRES_DB: penpot
      POSTGRES_USER: ${POSTGRES_USER:-penpot}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}"

  penpot-valkey:
    image: valkey/valkey:8.1-alpine
    restart: always
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep PONG"]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 3s
    networks:
      - penpot
    environment:
      VALKEY_EXTRA_FLAGS: "--maxmemory 256mb --maxmemory-policy volatile-lfu"
